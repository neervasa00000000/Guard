name: reproduce

on:
  push:
  pull_request:

jobs:
  archived-results:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Smoke tests
        run: python -m pytest -q tests/test_smoke_archives.py tests/test_padding.py tests/test_stored_a1_cell.py tests/test_release_product.py
      - name: Rebuild tables, figures, and check the manuscript
        run: make all
