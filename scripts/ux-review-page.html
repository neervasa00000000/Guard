<!doctype html><html lang="en"><meta charset="utf-8"><title>TEST ONLY Guard UX measurements</title><style>body{font:16px Arial;margin:16px}iframe{display:block;border:1px solid #777}pre{white-space:pre-wrap}button{padding:12px;margin-bottom:12px}</style>
<h1>TEST ONLY layout and accessibility measurements</h1><button id="run">Run UX measurements</button><button id="axe">Run two-width accessibility audit</button><button id="text">Run 200% text probe</button><p id="status" role="status">Ready</p><details><summary>Results</summary><pre id="results"></pre></details><iframe id="frame" title="QA viewport" width="390" height="844" src="viewport.html"></iframe>
<script>
const frame=document.querySelector('#frame'),out=document.querySelector('#results'),status=document.querySelector('#status');
async function load(width,height,file='viewport.html'){frame.width=width;frame.height=height;await new Promise(resolve=>{frame.onload=resolve;frame.src=file+'?ux-width='+width+'&run='+Date.now();});return frame.contentDocument;}
document.querySelector('#run').onclick=async()=>{out.removeAttribute('data-complete');const rows=[];for(const [width,height] of [[1280,800],[390,844],[320,740]]){const d=await load(width,height);for(const state of ['landing','genuine','redacted','tampered','unknown','self','fault','seal','seal-edit','advanced','about']){d.getElementById('qa-state').value=state;const metrics=await d.getElementById('qa-prepare').onclick();const checks={reflow:metrics.noHorizontalScroll};if(state==='landing'){checks.words=metrics.words<=40;checks.controls=metrics.visibleControls<=6;checks.noScroll=metrics.noVerticalScroll;}if(state==='seal'){checks.words=metrics.words<=70;checks.controls=metrics.visibleControls<=6;}if(['genuine','redacted','tampered','unknown','self','fault'].includes(state)){checks.aboveImageWords=metrics.aboveImageWords<=45;checks.resultButtons=metrics.resultButtons<=5;checks.detailsClosed=metrics.detailsClosed;if(width===390){checks.titleTop=metrics.titleTop<=160;if(['genuine','redacted','self'].includes(state))checks.downloadInView=metrics.plainVisible;}}rows.push({width,height,state,...metrics,checks,pass:Object.values(checks).every(Boolean)});out.textContent=JSON.stringify({rows},null,2);status.textContent=rows.filter(r=>r.pass).length+'/'+rows.length+' states pass';}}out.textContent=JSON.stringify({result:rows.every(r=>r.pass)?'ALL PASS':'FAIL',rows},null,2);out.dataset.complete='1';};
document.querySelector('#axe').onclick=async()=>{out.removeAttribute('data-complete');const rows=[];for(const [width,height] of [[1280,800],[390,844]]){const d=await load(width,height);await d.getElementById('qa-axe').onclick();const r=JSON.parse(d.getElementById('qa-results').textContent);rows.push({width,...r});const revoked=await load(width,height,'revoked-viewport.html');const revokedResult=await revoked.getElementById('qa-revoked').onclick();rows.push({width,scope:'revoked',result:revokedResult.pass&&revokedResult.violations.length===0?'ALL PASS':'FAIL',rows:[{state:'revoked',...revokedResult}]});out.textContent=JSON.stringify({rows},null,2);status.textContent='Audited '+rows.length+' widths';}out.textContent=JSON.stringify({result:rows.every(r=>r.result==='ALL PASS')?'ALL PASS':'FAIL',rows},null,2);out.dataset.complete='1';};
document.querySelector('#text').onclick=async()=>{out.removeAttribute('data-complete');const rows=[];for(const [width,height] of [[1280,800],[390,844],[320,740]])for(const state of ['landing','genuine','redacted','seal-edit','advanced','about']){const d=await load(width,height);d.getElementById('qa-state').value=state;await d.getElementById('qa-prepare').onclick();const metrics=await d.getElementById('qa-text').onclick();rows.push({width,state,...metrics,pass:metrics.noHorizontalScroll});if(state==='advanced'){for(const panel of d.querySelectorAll('.advanced-disclosure')){for(const other of d.querySelectorAll('.advanced-disclosure'))other.open=other===panel;await new Promise(resolve=>requestAnimationFrame(resolve));const expanded=JSON.parse(d.getElementById('qa-layout').onclick());rows.push({width,state:'advanced:'+panel.id,...expanded,pass:expanded.noHorizontalScroll});}}out.textContent=JSON.stringify({rows},null,2);status.textContent=rows.filter(r=>r.pass).length+'/'+rows.length+' enlarged-text states pass';}out.textContent=JSON.stringify({result:rows.every(r=>r.pass)?'ALL PASS':'FAIL',method:'Every element receives twice its baseline computed font size; CSS text-resize probe, not native browser zoom.',rows},null,2);out.dataset.complete='1';};
</script></html>
